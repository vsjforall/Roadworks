name: Build APK

# Builds the installable APK in GitHub's cloud so you never install
# Android Studio. Run it from the Actions tab, or on every push to main.
# The finished .apk appears under the run's "Artifacts" section.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: roadworks-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
