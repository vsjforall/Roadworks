plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'in.mytsys.roadworks'
    compileSdk 34

    defaultConfig {
        applicationId "in.mytsys.roadworks"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        // The one line you edit. Point it at wherever you host the backend.
        buildConfigField "String", "FEED_URL", "\"https://reports.mytsys.com\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        release {
            minifyEnabled false
            // Debug-signed on purpose. Sideloaded APKs for friends do not
            // need a release keystore, and adding one now means managing a
            // secret you cannot afford to lose before the app has users.
            signingConfig signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
